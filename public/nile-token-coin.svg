    <!-- CENTRAL 3D SCULPTURED HORUS & PYRAMID EMBLEM -->
    <g filter='url(#relief-shadow)'>
      <!-- 1. The Royal Egyptian Horus Headdress / Wings Crown -->
      <path d='M512 210 C420 210 350 250 320 310 C380 290 480 290 512 290 C544 290 644 290 704 310 C674 250 604 210 512 210 Z' 
            fill='url(#relief-gold)' stroke='#543700' stroke-width='4' />
      <path d='M512 220 C440 220 380 255 350 295 C410 280 480 282 512 282 C544 282 614 280 674 295 C644 255 584 220 512 220 Z' 
