<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' width='1024' height='1024'>
  <defs>
    <!-- Background / Glow Gradients -->
    <radialGradient id='ambient-glow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#F5D061' stop-opacity='0.45'/>
      <stop offset='45%' stop-color='#D4AF37' stop-opacity='0.2'/>
      <stop offset='80%' stop-color='#996F00' stop-opacity='0.05'/>
      <stop offset='100%' stop-color='#030611' stop-opacity='0'/>
    </radialGradient>

    <!-- Outer Rim Gold Gradients -->
    <linearGradient id='rim-gold-1' x1='15%' y1='5%' x2='85%' y2='95%'>
      <stop offset='0%' stop-color='#FFF8D6'/>
      <stop offset='15%' stop-color='#F3DF79'/>
      <stop offset='35%' stop-color='#D4AF37'/>
      <stop offset='55%' stop-color='#996F00'/>
      <stop offset='75%' stop-color='#E5B842'/>
      <stop offset='90%' stop-color='#FFF2A3'/>
      <stop offset='100%' stop-color='#7A5300'/>
    </linearGradient>

    <linearGradient id='rim-gold-2' x1='85%' y1='95%' x2='15%' y2='5%'>
      <stop offset='0%' stop-color='#5A3B00'/>
      <stop offset='25%' stop-color='#996F00'/>
      <stop offset='50%' stop-color='#E5B842'/>
      <stop offset='75%' stop-color='#FFF6C7'/>
      <stop offset='100%' stop-color='#D4AF37'/>
    </linearGradient>

    <!-- Inner Core Obsidian / Royal Navy -->
    <radialGradient id='coin-bed' cx='45%' cy='40%' r='60%'>
      <stop offset='0%' stop-color='#162544'/>
      <stop offset='40%' stop-color='#0B1426'/>
      <stop offset='75%' stop-color='#060B16'/>
      <stop offset='100%' stop-color='#020409'/>
    </radialGradient>

    <!-- 3D Horus Relief Gold -->
    <linearGradient id='relief-gold' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFBE0'/>
      <stop offset='20%' stop-color='#FCE183'/>
      <stop offset='45%' stop-color='#E5B842'/>
      <stop offset='70%' stop-color='#B8860B'/>
      <stop offset='90%' stop-color='#D4AF37'/>
      <stop offset='100%' stop-color='#704A00'/>
    </linearGradient>

    <linearGradient id='relief-highlight' x1='30%' y1='0%' x2='70%' y2='100%'>
      <stop offset='0%' stop-color='#FFFFFF' stop-opacity='0.9'/>
      <stop offset='30%' stop-color='#FFF2A3' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#D4AF37' stop-opacity='0'/>
    </linearGradient>

    <linearGradient id='cyan-accent' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#00FFC2'/>
      <stop offset='100%' stop-color='#00A3FF'/>
    </linearGradient>

    <!-- Filters for Depth and Metallic Sheen -->
    <filter id='drop-shadow' x='-15%' y='-15%' width='130%' height='130%'>
      <feDropShadow dx='0' dy='16' stdDeviation='24' flood-color='#000000' flood-opacity='0.75'/>
      <feDropShadow dx='0' dy='4' stdDeviation='8' flood-color='#E5B842' flood-opacity='0.35'/>
    </filter>

    <filter id='relief-shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='4' dy='8' stdDeviation='6' flood-color='#000000' flood-opacity='0.85'/>
      <feDropShadow dx='-2' dy='-2' stdDeviation='3' flood-color='#FFF8D6' flood-opacity='0.5'/>
    </filter>

    <filter id='eye-glow' x='-30%' y='-30%' width='160%' height='160%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx='512' cy='512' r='490' fill='url(#ambient-glow)' />

  <!-- Master Coin Container with Drop Shadow -->
  <g filter='url(#drop-shadow)'>
    <!-- Outer Reeded Fluting (Notches around outer rim) -->
