<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B842" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0F1E36" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="35%" stop-color="#E5B842"/>
      <stop offset="70%" stop-color="#D49B24"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E5B842" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A1224" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Banking Backing -->
  <rect width="512" height="512" rx="112" fill="#050A14" />
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />
  
  <!-- Subtle Outer Precision Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#E5B842" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#E5B842" stroke-opacity="0.12" stroke-width="1" />

  <!-- Triangle Fill -->
  <polygon points="256,92 416,368 96,368" fill="url(#innerGlow)" />

  <!-- Outer Glow Triangle -->
  <polygon points="256,92 416,368 96,368" fill="none" stroke="#E5B842" stroke-opacity="0.5" stroke-width="14" filter="url(#softGlow)" stroke-linejoin="round" />

  <!-- Primary Golden Triangle -->
  <polygon points="256,92 416,368 96,368" fill="none" stroke="url(#goldLineGrad)" stroke-width="9" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Concentric Circle Glow -->
  <circle cx="256" cy="276" r="64" fill="#070D1B" stroke="#E5B842" stroke-opacity="0.4" stroke-width="12" filter="url(#softGlow)" />

  <!-- Primary Golden Circle -->
  <circle cx="256" cy="276" r="64" fill="#070D1B" stroke="url(#goldLineGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Center Core Illuminator -->
  <circle cx="256" cy="276" r="8" fill="#FFF3B0" opacity="0.9" />
</svg>